name: 'BaGetter NuGet Server'
description: 'Start a BaGetter NuGet server backed by GitHub storage and stop it automatically in post action cleanup'
branding:
  icon: package
  color: blue
inputs:
  url:
    description: 'BaGetter server URL'
    required: false
    default: 'http://127.0.0.1:5050'
  api-key:
    description: 'BaGetter API key used for package pushes'
    required: false
    default: 'github-actions'
  owner:
    description: 'GitHub storage repository owner'
    required: true
  repository:
    description: 'GitHub storage repository name'
    required: true
  token:
    description: 'GitHub token with repository contents write access'
    required: true
  branch:
    description: 'GitHub storage branch. Empty means the repository default branch'
    required: false
    default: ''
  root-path:
    description: 'Optional BaGetter storage root path inside the repository'
    required: false
    default: ''
  api-base-url:
    description: 'GitHub API base URL'
    required: false
    default: 'https://api.github.com'
  database-path:
    description: 'SQLite database path. Empty uses RUNNER_TEMP'
    required: false
    default: ''
outputs:
  source-url:
    description: 'NuGet V3 source URL'
  api-key:
    description: 'BaGetter API key'
runs:
  using: 'node20'
  main: '.github/actions/bagetter-server/index.js'
  post: '.github/actions/bagetter-server/post.js'
