name: 'BaGetter NuGet Server'
description: 'Run BaGetter in a Docker action and push NuGet packages through the server'
branding:
  icon: package
  color: blue
inputs:
  package-path:
    description: 'Path, directory, or glob pattern for .nupkg files to push. Symbol packages are ignored'
    required: true
  api-key:
    description: 'BaGetter API key used for package pushes'
    required: false
    default: 'github-actions'
  owner:
    description: 'GitHub storage repository owner'
    required: true
  repository:
    description: 'GitHub storage repository name'
    required: true
  token:
    description: 'GitHub token with repository contents write access'
    required: true
  branch:
    description: 'GitHub storage branch. Empty means the repository default branch'
    required: false
    default: ''
  root-path:
    description: 'Optional BaGetter storage root path inside the repository'
    required: false
    default: ''
  api-base-url:
    description: 'GitHub API base URL'
    required: false
    default: 'https://api.github.com'
runs:
  using: 'docker'
  image: 'Dockerfile'
  entrypoint: '/entrypoint.sh'
  args:
  - ${{ inputs.package-path }}
  - ${{ inputs.api-key }}
  - ${{ inputs.owner }}
  - ${{ inputs.repository }}
  - ${{ inputs.token }}
  - ${{ inputs.branch }}
  - ${{ inputs.root-path }}
  - ${{ inputs.api-base-url }}
